<!doctype html><meta charset="utf-8"><title>Blind orange-trail audit</title>
<style>body{font:16px system-ui;margin:20px;background:#151515;color:#eee}canvas{height:72vh;max-width:95vw;touch-action:none;border:1px solid #555}button,select,input{font:inherit;margin:4px}#tools{max-width:900px}</style>
<h1>Blind orange-trail audit</h1>
<p>Trace visible trail centres only. Mark contact centres on native frames, first/last visible motion, and the endpoint. Do not infer a hidden path. Export includes source PTS.</p>
<div id="tools"><select id="clip"></select><button id="prev">Previous frame</button><button id="next">Next frame</button><input id="frame" type="range" min="0"><span id="stamp"></span><br>
<select id="mode"><option value="trail">Draw visible centreline</option><option value="contact">Click contact centre</option><option value="endpoint">Click endpoint</option></select>
<button id="first">First visible motion</button><button id="last">Last visible motion</button>
<label><input type="checkbox" id="complete">Complete trail visible</label>
<label>Touch continuity <select id="continuity"><option value="unknown">Indeterminate</option><option value="continuous">Continuous</option><option value="interrupted">Interrupted</option></select></label>
<label>Whole trail appears in one frame <select id="collapse"><option value="unknown">Indeterminate</option><option value="no">No</option><option value="yes">Yes</option></select></label>
<button id="clear">Clear this annotation</button><button id="export">Export JSON</button></div>
<canvas id="canvas"></canvas>
<script src="review_integrity.js"></script><script src="clips.js"></script><script>
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),sel=document.querySelector('#clip'),slider=document.querySelector('#frame');
const marks={};let loaded=false,integrityFailed=false,loadToken=0;let current=0,index=0,drawing=false,img=new Image();
for(const [i,c] of CLIPS.entries()){let o=document.createElement('option');o.value=i;o.textContent=c.token;sel.append(o)}
function mark(){let c=CLIPS[current];return marks[c.token]??=( {centreline:[],contacts:[],complete_trail:false,interruption:null,collapse:null,motion_start_s:null,motion_end_s:null,endpoint:null} )}
function render(){let c=CLIPS[current],f=c.frames[index],token=++loadToken;loaded=false;canvas.style.pointerEvents='none';img.onload=null;slider.max=c.frames.length-1;slider.value=index;document.querySelector('#stamp').textContent=`Frame ${f.source_frame}, PTS ${f.pts_s.toFixed(6)} s`;reviewFrameUrl(f).then(url=>{if(token!==loadToken){URL.revokeObjectURL(url);return}img.onload=()=>{if(token!==loadToken)return;loaded=!integrityFailed;canvas.style.pointerEvents=loaded?'auto':'none';canvas.width=img.width;canvas.height=img.height;ctx.drawImage(img,0,0);ctx.fillStyle='#43ff8a';for(const p of mark().centreline){ctx.fillRect(p[0]*canvas.width-1,p[1]*canvas.height-1,3,3)}for(const p of mark().contacts.filter(p=>p.source_frame===f.source_frame)){ctx.beginPath();ctx.arc(p.xy[0]*canvas.width,p.xy[1]*canvas.height,5,0,7);ctx.strokeStyle='#43ff8a';ctx.stroke()}};if(img.src?.startsWith('blob:'))URL.revokeObjectURL(img.src);img.src=url}).catch(()=>{integrityFailed=true;canvas.style.pointerEvents='none';document.querySelector('#export').disabled=true;document.querySelector('#stamp').textContent='Footage changed or unavailable; rebuild this review'});document.querySelector('#complete').checked=mark().complete_trail;document.querySelector('#continuity').value=mark().interruption===null?'unknown':mark().interruption?'interrupted':'continuous';document.querySelector('#collapse').value=mark().collapse===null?'unknown':mark().collapse?'yes':'no'}
function point(e){let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
canvas.onpointerdown=e=>{if(!loaded)return;canvas.setPointerCapture(e.pointerId);let mode=document.querySelector('#mode').value,p=point(e),f=CLIPS[current].frames[index];if(mode==='trail'){drawing=true;mark().centreline.push(p)}else if(mode==='endpoint'){mark().endpoint=p}else{mark().contacts.push({xy:p,pts_s:f.pts_s,source_frame:f.source_frame})}render()};
canvas.onpointermove=e=>{if(drawing){let p=point(e);mark().centreline.push(p);ctx.fillStyle='#43ff8a';ctx.fillRect(p[0]*canvas.width,p[1]*canvas.height,3,3)}};canvas.onpointerup=()=>drawing=false;
sel.onchange=()=>{current=+sel.value;index=0;render()};slider.oninput=()=>{index=+slider.value;render()};document.querySelector('#prev').onclick=()=>{index=Math.max(0,index-1);render()};document.querySelector('#next').onclick=()=>{index=Math.min(CLIPS[current].frames.length-1,index+1);render()};
document.querySelector('#first').onclick=()=>{if(loaded)mark().motion_start_s=CLIPS[current].frames[index].pts_s};document.querySelector('#last').onclick=()=>{if(loaded)mark().motion_end_s=CLIPS[current].frames[index].pts_s};
document.querySelector('#complete').onchange=e=>{if(loaded)mark().complete_trail=e.target.checked};document.querySelector('#continuity').onchange=e=>{if(loaded)mark().interruption=e.target.value==='unknown'?null:e.target.value==='interrupted'};document.querySelector('#collapse').onchange=e=>{if(loaded)mark().collapse=e.target.value==='unknown'?null:e.target.value==='yes'};
document.querySelector('#clear').onclick=()=>{delete marks[CLIPS[current].token];render()};document.querySelector('#export').onclick=()=>{if(integrityFailed||!loaded)return;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({schema:BUNDLE_SCHEMA,bundle_sha256:BUNDLE_SHA256,annotations:marks},null,2)],{type:'application/json'}));a.download='blind-curve-annotations.json';a.click()};render();
</script>
