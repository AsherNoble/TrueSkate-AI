<!doctype html><html lang="en"><meta charset="utf-8"><title>Frozen human gesture comparison</title>
<style>body{font:17px system-ui;background:#10151d;color:#edf1f7;margin:24px}canvas{max-height:75vh;max-width:95vw}button,select{font:inherit;margin:8px;padding:8px}video{display:none}</style>
<h1>Human gesture comparison</h1><p>Left: actual gameplay. Right: the same frame with the inferred contact. This is qualitative review; no synthetic gesture is treated as the human ground truth.</p>
<select id="clip"></select><button id="play">Play / pause</button><button id="back">Previous frame</button><button id="next">Next frame</button><span id="stamp"></span><br><canvas id="canvas"></canvas><video id="video" preload="auto"></video>
<script>const data=__DATA__;const video=document.getElementById('video'),canvas=document.getElementById('canvas'),select=document.getElementById('clip');let chosen=0,frame=0;
data.samples.forEach((s,i)=>select.add(new Option((i+1)+' · '+s.park,i)));
function draw(t){const s=data.samples[chosen],p=s.prediction;canvas.width=video.videoWidth*2;canvas.height=video.videoHeight;const c=canvas.getContext('2d'),w=video.videoWidth,h=video.videoHeight;c.drawImage(video,0,0);c.drawImage(video,w,0);if(t>=p.onset_s&&t<=p.release_s){const dt=(t-p.onset_s)*1000;let k=1;while(k<p.times_ms.length-1&&p.times_ms[k]<dt)k++;const u=Math.max(0,Math.min(1,(dt-p.times_ms[k-1])/(p.times_ms[k]-p.times_ms[k-1])));const q=p.points[k-1].map((x,a)=>x+u*(p.points[k][a]-x));c.strokeStyle='#6fffd1';c.lineWidth=3;c.beginPath();c.ellipse(w+q[0]*w,q[1]*h,10*w/414,10*h/896,0,0,2*Math.PI);c.stroke()}frame=s.frame_times_s.reduce((best,x,i)=>Math.abs(x-t)<Math.abs(s.frame_times_s[best]-t)?i:best,0);document.getElementById('stamp').textContent='Frame '+frame+' · '+t.toFixed(4)+' s';}
function callback(now,metadata){draw(metadata.mediaTime);video.requestVideoFrameCallback(callback)}video.requestVideoFrameCallback(callback);
function load(){video.pause();chosen=+select.value;video.src=data.samples[chosen].video;video.currentTime=0;frame=0}select.onchange=load;document.getElementById('play').onclick=()=>video.paused?video.play():video.pause();
function step(d){video.pause();const ts=data.samples[chosen].frame_times_s;frame=Math.max(0,Math.min(119,frame+d));video.currentTime=ts[frame]+.000001;}document.getElementById('back').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);load();</script></html>
